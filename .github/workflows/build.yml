name: Build AirScreen Executable and Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn websockets mss opencv-python numpy psutil qrcode pillow pywebview pystray dxcam pyinstaller

      - name: Compile Windows Executable
        run: |
          python build_app.py

      - name: Archive Windows Application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AirScreen -DestinationPath dist/AirScreen-Windows-x64.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirScreen-Windows-x64
          path: dist/AirScreen-Windows-x64.zip
          retention-days: 14

  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew || true
          gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirScreen-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
